<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppForge Labs — Coming soon</title>
  <meta name="description" content="AppForge Labs is a Canadian app studio crafting polished, privacy-first mobile apps. Something new is in the forge. Coming soon.">
  <meta name="theme-color" content="#7E22CE">
  <link rel="canonical" href="https://appforgelabs.ca/">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AppForge Labs">
  <meta property="og:title" content="AppForge Labs — Coming soon">
  <meta property="og:description" content="A Canadian app studio crafting polished, privacy-first mobile apps. Something new is in the forge.">
  <meta property="og:url" content="https://appforgelabs.ca/">
  <meta property="og:image" content="https://appforgelabs.ca/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Brand colours match the full site (version-1 branch, styles.css). */
    :root {
      --gradient: linear-gradient(135deg, #9333ea 0%, #2563eb 60%, #4338ca 100%);
      --bg: #f9fafb;
      --surface: #ffffff;
      --text: #111827;
      --text-2: #4b5563;
      --text-3: #6b7280;
      --border: #e5e7eb;
      --accent-text: #7e22ce;
      --shadow: 0 20px 50px -20px rgba(76, 29, 149, 0.35);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --surface: #151c2f;
        --text: #f9fafb;
        --text-2: #cbd5e1;
        --text-3: #94a3b8;
        --border: #273047;
        --accent-text: #c084fc;
        --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .glow {
      position: fixed; top: 50%; left: 50%; z-index: -1;
      width: 900px; height: 900px; max-width: 140vw; max-height: 140vw;
      transform: translate(-50%, -55%);
      background: radial-gradient(circle, rgba(147, 51, 234, 0.26), rgba(37, 99, 235, 0.12) 45%, transparent 70%);
      filter: blur(20px); pointer-events: none;
    }

    .lang-switch {
      position: absolute; top: 20px; right: 16px;
      display: inline-flex; padding: 3px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
    }
    .lang-switch button {
      font: inherit; font-size: 0.8rem; font-weight: 700;
      border: 0; background: transparent; color: var(--text-3);
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .lang-switch button[aria-pressed='true'] { background: var(--gradient); color: #fff; }

    main {
      flex: 1;
      display: grid; place-items: center;
      padding: 96px 16px 48px;
      text-align: center;
    }
    .teaser { width: 100%; max-width: 40rem; }

    .logo {
      display: block; margin: 0 auto 28px;
      border-radius: 22px; box-shadow: var(--shadow);
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-8px); } }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent-text);
      margin: 0 0 1rem;
    }
    .eyebrow::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 800;
      line-height: 1.1; letter-spacing: -0.02em;
      margin: 0 0 0.4em;
    }
    .gradient-text {
      background: var(--gradient);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .lead { font-size: 1.15rem; color: var(--text-2); margin: 0 auto 2rem; max-width: 32em; }

    .hint {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 18px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 0.95rem; font-weight: 600; color: var(--text-2);
    }

    footer { padding: 24px 16px 32px; text-align: center; font-size: 0.85rem; color: var(--text-3); }

    @media (prefers-reduced-motion: reduce) {
      .logo, .eyebrow::before { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
  </div>

  <main>
    <div class="teaser">
      <img class="logo" src="assets/logo.svg" alt="AppForge Labs" width="96" height="96">
      <p class="eyebrow" data-i18n="eyebrow">Coming soon</p>
      <h1 data-i18n-html="title">Something new is <span class="gradient-text">in the forge.</span></h1>
      <p class="lead" data-i18n="lead">AppForge Labs is a small Canadian studio crafting polished, privacy-first mobile apps. Our first one is almost ready, and it's about to make game night a whole lot easier.</p>
      <p class="hint">🎲 <span data-i18n="hint">Launching soon on Google Play</span></p>
    </div>
  </main>

  <footer>© <span id="year">2026</span> AppForge Labs · <span data-i18n="footer">Made in Canada 🍁</span></footer>

  <script>
    const T = {
      en: {
        title: 'Something new is <span class="gradient-text">in the forge.</span>',
        eyebrow: 'Coming soon',
        lead: "AppForge Labs is a small Canadian studio crafting polished, privacy-first mobile apps. Our first one is almost ready, and it's about to make game night a whole lot easier.",
        hint: 'Launching soon on Google Play',
        footer: 'Made in Canada 🍁',
        docTitle: 'AppForge Labs — Coming soon'
      },
      fr: {
        title: 'Quelque chose de nouveau <span class="gradient-text">sort de la forge.</span>',
        eyebrow: 'Bientôt disponible',
        lead: 'AppForge Labs est un petit studio canadien qui crée des applications mobiles soignées et respectueuses de la vie privée. Notre première est presque prête, et elle va grandement simplifier vos soirées de jeux.',
        hint: 'Bientôt sur Google Play',
        footer: 'Fait au Canada 🍁',
        docTitle: 'AppForge Labs — Bientôt disponible'
      }
    };

    function setLang(lang) {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.docTitle;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
      document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
      try { localStorage.setItem('lang', lang); } catch (e) {}
    }

    let stored = null;
    try { stored = localStorage.getItem('lang'); } catch (e) {}
    const param = new URLSearchParams(location.search).get('lang');
    const initial = [param, stored].find(l => l in T) ||
      ((navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en');
    if (initial !== 'en') setLang(initial);

    document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
